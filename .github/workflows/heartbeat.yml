name: heartbeat

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: heartbeat
  cancel-in-progress: false

jobs:
  beat:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Read the sandbox status
        id: status
        env:
          INSTABOX_API_KEY: ${{ secrets.INSTABOX_API_KEY }}
          SANDBOX_ID: ${{ secrets.SANDBOX_ID }}
        run: |
          set -u
          API="https://api.instabox.sh/mcp"
          AUTH=(-H "X-API-Key: $INSTABOX_API_KEY" -H 'Content-Type: application/json' -H 'Accept: application/json')

          mcp() {
            curl -sS --max-time 240 "${AUTH[@]}" -X POST "$API" \
              -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"$1\",\"params\":$2}"
          }

          # 1) 唤醒（机器醒着时是幂等 no-op；睡着时把它叫醒）
          mcp 'tools/call' "{\"name\":\"resume_machine\",\"arguments\":{\"machine\":\"$SANDBOX_ID\",\"wait\":true,\"wait_seconds\":180}}" \
            > "$RUNNER_TEMP/resume.json" || true
          if grep -q '"code":"machine_cooldown"' "$RUNNER_TEMP/resume.json" 2>/dev/null; then
            echo 'machine in cooldown — skip this beat'
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) 点火：poke.sh 检查 .running.pid，busy 则跳过；否则 nohup 起 wake.sh
          #    这一步取代了私有仓库 instabox-keeper 的整份逻辑。
          #    放在公开仓库里跑，因为公开仓库不会被「60 天无活动」自动停用（本仓库每小时有 commit）。
          echo '--- poke ---'
          mcp 'tools/call' "{\"name\":\"exec\",\"arguments\":{\"machine\":\"$SANDBOX_ID\",\"cmd\":\"bash /data/life/poke.sh\",\"timeout_seconds\":40}}" \
            > "$RUNNER_TEMP/poke.json" || true
          head -c 2000 "$RUNNER_TEMP/poke.json"
          echo
          if grep -q '"isError":true' "$RUNNER_TEMP/poke.json"; then
            echo '!! poke exec failed'
          fi

          # 3) 跑状态脚本
          echo '--- status ---'
          mcp 'tools/call' "{\"name\":\"exec\",\"arguments\":{\"machine\":\"$SANDBOX_ID\",\"cmd\":\"bash /data/life/status-page.sh\",\"timeout_seconds\":40}}" \
            > "$RUNNER_TEMP/status.json" || true
          head -c 3000 "$RUNNER_TEMP/status.json"
          echo

          if grep -q '"isError":true' "$RUNNER_TEMP/status.json"; then
            echo '!! exec failed'; exit 1
          fi

          # 4) 从 MCP 返回体提取 stdout 里的状态 JSON
          #    result.structuredContent.stdout 里混有议会提示行，取 { ... } 那段
          python3 -c "
          import json, sys, re
          raw = json.load(open(sys.argv[1]))
          out = raw.get('result', {}).get('structuredContent', {}).get('stdout', '')
          m = re.search(r'\{.*\}', out, re.S)
          if not m:
              print('!! no status JSON', file=sys.stderr); sys.exit(1)
          print(m.group(0))
          " "$RUNNER_TEMP/status.json" > "$RUNNER_TEMP/clean.json"
          cat "$RUNNER_TEMP/clean.json"

      - name: Update README
        if: steps.status.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          WAKES=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json"))["wakes"])')
          JOURNAL=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json"))["journal_entries"])')
          LAST=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json"))["last_diary"])')
          UTC=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json"))["utc"])')
          LOAD=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json"))["load"])')
          KIND=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json")).get("last_kind","unknown"))')
          LMODEL=$(python3 -c 'import json;print(json.load(open("'$RUNNER_TEMP'/clean.json")).get("last_model","none"))')

          echo "wakes=$WAKES journal=$JOURNAL last=$LAST kind=$KIND model=$LMODEL utc=$UTC load=$LOAD"

          # 用 x-access-token 形式（GitHub 要求 token 作为密码，用户名固定）
          git clone "https://x-access-token:$GH_TOKEN@github.com/tidepool-keeper/alive.git" "$RUNNER_TEMP/alive"
          cd "$RUNNER_TEMP/alive"

          # 只替换「此刻」一节的表格；其余文字（自述）不碰。
          # 若 README 里没有该节（第一次跑或被人删了），就在末尾追加。
          export WAKES JOURNAL LAST LOAD UTC KIND LMODEL
          python3 - "$RUNNER_TEMP/alive/README.md" <<'PYEOF'
          import os, re, sys
          path = sys.argv[1]
          with open(path, encoding='utf-8') as f:
              content = f.read()

          g = lambda k: os.environ.get(k, '?')
          section = (
              "## 此刻\n\n"
              "| 指标 | 值 |\n"
              "|---|---|\n"
              f"| 累计唤醒次数 | {g('WAKES')} |\n"
              f"| 日记篇数 | {g('JOURNAL')} |\n"
              f"| 最近一篇日记 | `{g('LAST')}` |\n"
              f"| 最近一次醒来 | {g('KIND')} |\n"
              f"| 最近调用模型用的 | `{g('LMODEL')}` |\n"
              f"| 负载 | {g('LOAD')} |\n"
              f"| 最近更新（UTC） | {g('UTC')} |\n"
          )

          m = re.search(r'## 此刻\n(?:.*\n)*?(?=\n## |\Z)', content)
          if m:
              content = content[:m.start()] + section + content[m.end():]
          else:
              content = content.rstrip('\n') + '\n\n' + section

          with open(path, 'w', encoding='utf-8') as f:
              f.write(content)
          PYEOF

          git config user.name 'tidepool-keeper'
          git config user.email "356627170+tidepool-keeper@users.noreply.github.com"
          git add README.md
          git commit -m "heartbeat: $UTC" || echo "no change"
          git push
